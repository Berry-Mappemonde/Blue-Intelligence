name: Weekly data build

# Automated weekly rebuild (inspired by Open Waters: Seamap, which rebuilds
# its planetary chart every Monday 03:00 UTC): archive the seven GeoJSON
# exports from the production API, audit field coverage, build an overlay
# PMTiles archive (tippecanoe), then publish everything in a dated immutable
# `data-<YYYY-MM-DD>` release — `gh release create` fails if the tag already
# exists, so immutability is structural, not a convention.
#
# No extra secret required: the API is public, GITHUB_TOKEN publishes the release.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC — after the Seamap planet build (03:00)
  workflow_dispatch:
    inputs:
      base_url:
        description: "Blue Intelligence API URL to archive"
        default: "https://blueintelligence.online"

permissions:
  contents: write

env:
  BASE_URL: ${{ inputs.base_url || 'https://blueintelligence.online' }}

concurrency:
  group: weekly-data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build date
        run: echo "STAMP=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Download the seven GeoJSON exports
        run: |
          mkdir -p dist
          set -euo pipefail
          while read -r endpoint filename; do
            echo "→ $endpoint"
            curl -fsSL --retry 4 --retry-delay 5 --max-time 600 \
              "$BASE_URL/api/export/$endpoint" -o "dist/$filename"
            python3 -c "import json,sys; fc=json.load(open('dist/$filename')); print('  ', '$filename', len(fc.get('features',[])), 'features, version', (fc.get('metadata') or {}).get('version'))"
          done <<'EOF'
          geojson projects.geojson
          marinas.geojson marinas.geojson
          anchorages.geojson anchorages.geojson
          capitaineries.geojson capitaineries.geojson
          amp.geojson amp.geojson
          poe.geojson ports_of_entry.geojson
          route.geojson route.geojson
          EOF

      - name: Tag audit (export coverage)
        run: |
          python3 scripts/audit_tags.py --geojson dist/*.geojson \
            --out "dist/audit-tags-$STAMP.md"

      - name: Install tippecanoe (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version

      - name: Build the overlay PMTiles archive
        run: |
          tippecanoe -o "dist/blue-intelligence-$STAMP.pmtiles" --force \
            -zg --drop-densest-as-needed --coalesce-densest-as-needed \
            --name "Blue Intelligence $STAMP" \
            --attribution "© Blue Intelligence — data © OpenStreetMap contributors (ODbL) and per-dataset cited sources" \
            -L projects:dist/projects.geojson \
            -L marinas:dist/marinas.geojson \
            -L anchorages:dist/anchorages.geojson \
            -L capitaineries:dist/capitaineries.geojson \
            -L amp:dist/amp.geojson \
            -L poe:dist/ports_of_entry.geojson \
            -L route:dist/route.geojson

      - name: Checksums
        run: cd dist && sha256sum -- * > "SHA256SUMS-$STAMP.txt"

      - name: Publish the dated immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "data-$STAMP" dist/* \
            --title "Data $STAMP" \
            --notes "Immutable weekly archive of Blue Intelligence exports (versioned GeoJSON + overlay PMTiles + tag audit). Source: $BASE_URL. Not for navigation — check official sources."
