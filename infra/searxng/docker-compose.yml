# Self-hosted SearXNG — search engine for the PoE pipeline (open source, AGPL).
#
# Public SearXNG instances block JSON or return 429:
# a local instance guarantees free, unlimited, multi-engine SERPs.
#
# Start   : docker compose -f infra/searxng/docker-compose.yml up -d
# Backend : SEARXNG_URL=http://127.0.0.1:8888 in backend/.env
#             (the local instance goes first, public ones stay
#              as fallback; without the variable, behaviour is unchanged)
services:
  searxng:
    image: searxng/searxng:latest
    container_name: blue-intelligence-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    restart: unless-stopped
