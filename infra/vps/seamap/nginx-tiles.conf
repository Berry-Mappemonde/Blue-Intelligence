# Sea-chart mirror — include INSIDE the HTTPS `server { … }` block of
# /etc/nginx/sites-available/blue-intelligence (see this folder's README.md).
#
# Serves /srv/tiles/seamap/public/ under https://blueintelligence.online/tiles/seamap/:
#   - current.pmtiles  → read by byte ranges (Range) by the frontend pmtiles://
#     protocol; nginx handles Range natively on static files.
#   - style.json / VERSION → pointers, short cache to follow weekly builds.
#   - sprites/         → nautical icon sheet (CC-BY, openwatersio/seamap).

location /tiles/seamap/ {
    alias /srv/tiles/seamap/public/;

    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Pointers (style.json, VERSION, current.pmtiles): short cache —
    # content changes on every weekly upstream build.
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;

    types {
        application/json json;
        image/png png;
    }
    default_type application/octet-stream;
}
