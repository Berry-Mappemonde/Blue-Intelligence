# /etc/nginx/sites-available/bi-local-cache — écoute seulement 127.0.0.1:8002.
#
# Le simulateur de prod doit parler à Blue Intelligence par ici
# (BI_API_URL=http://127.0.0.1:8002/api), pas à uvicorn :8001.
# /api/climatology/* passe par le cache nginx partagé (zone bi_climo,
# incident 2026-09-21). Une rafale du film ou du prefetch ne recalcule
# pas chaque point dans l'event loop de BI.
#
# Installé par infra/vps/install-memory-guards.sh et deploy-simulator.sh.

server {
    listen 127.0.0.1:8002;
    server_name _;
    client_max_body_size 25m;

    location /api/climatology/ {
        include snippets/bi-climatology-cache.conf;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host blueintelligence.online;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_read_timeout 120;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host blueintelligence.online;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_read_timeout 120;
    }
}
